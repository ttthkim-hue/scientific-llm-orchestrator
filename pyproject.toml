[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-llm-orchestrator"
version = "0.1.0"
description = "Evidence-gated routing of frontier, hosted-open, and local language models for scientific software engineering."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "scientific-llm-orchestrator contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering"
]

[tool.scientific_llm_orchestrator]
automatic_apply = false
runtime_dependencies = "Python standard library only"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
